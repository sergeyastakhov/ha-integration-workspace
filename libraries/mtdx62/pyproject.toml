[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtdx62"
version = "0.2.0"
description = "Device library for the MTD062-MB and MTD262-MB Modbus presence sensors"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "HomeAssistantDev" }]
keywords = ["modbus", "presence sensor", "radar", "home assistant"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["modbus-connection>=4.12.4,<5"]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "pytest-asyncio>=1.0",
  "pytest-cov>=6.0",
  "mypy>=1.13",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mtdx62"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "N", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
