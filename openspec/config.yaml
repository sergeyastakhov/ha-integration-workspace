schema: spec-driven

context: |
  Корень сквозных требований проекта. Здесь живут только те требования, которые действуют на
  несколько интеграций сразу: правила протокола и транспорта, доступность и идентичность
  сущностей, локализация, диагностика, упаковка для Marketplace, сообщения мастера настройки,
  зависимости и тестовый стек, проверка выпуска на живом Home Assistant.

  Главный источник этих требований — опыт разработки: то, что сломалось на живом устройстве,
  один раз разбирается и превращается в правило, действующее для всех интеграций. Частная
  формулировка из локальных правил при этом удаляется, чтобы AGENTS.md не разрастался вместе с
  числом шишек.

  Требования конкретной интеграции живут в `integrations/<domain>/openspec/`, требования
  конкретной библиотеки — в `libraries/<name>/openspec/`. Каждый корень — самостоятельный
  OpenSpec-проект: при выносе интеграции или библиотеки в отдельный репозиторий спецификации
  уезжают вместе с кодом.

  Правила проекта и обоснования — в AGENTS.md в корне репозитория. Факты о конкретном
  устройстве — в `docs/` его библиотеки (`conventions/device-documentation`).

  Язык: артефакты на русском; заголовки OpenSpec, ключевые слова SHALL/MUST и код — на
  английском.

rules:
  proposal:
    - "Влияние на интеграции: при изменении сквозного требования перечислить, какие интеграции
      и библиотеки оно затрагивает, и указать, каким изменением в их корнях оно доводится до кода."
    - "Если требование уже реализовано во всех интеграциях и меняется только формулировка,
      сказать это прямо и не планировать работ."
    - "Откуда правило: если сквозное требование родилось из конкретного дефекта, записать сам
      случай в сценарий. Сценарий, придуманный ради формы, в этом корне бесполезен."
  specs:
    - "Требование описывает то, что одинаково для всех интеграций. Всё, что зависит от
      конкретного устройства или протокола, сюда не попадает — это спецификация интеграции."
    - "Ссылка на документ Home Assistant обязательна: сквозное требование должно опираться на
      правило проекта или upstream, а не на вкус автора."
    - "Требование держится короче 500 символов: подробности и исключения уходят в сценарии, иначе
      линтер OpenSpec предупреждает, а читать становится нечего."
  tasks:
    - "Групп задач может не быть вообще: изменение только формулировки требований не требует кода.
      Если задач нет, изменение закрывается архивированием после проверки."
    - "Если правило поднято в этот корень, в задачах должна быть строка об удалении его частной
      копии из AGENTS.md или из спецификации интеграции."

operations:
  apply:
    guidance:
      - "Сквозное требование без доведения до интеграций считается нереализованным: после
        изменения откройте изменения в корнях затронутых интеграций."
      - "Подняли общее правило — проверьте, не осталось ли его частного пересказа ниже: дубликат
        в правилах интеграции переживёт первоисточник и начнёт противоречить ему."
