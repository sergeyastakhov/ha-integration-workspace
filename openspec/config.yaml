schema: spec-driven

context: |
  Проект: набор интеграций устройств для Home Assistant. Распространение — через Marketplace
  (custom_components, один репозиторий на интеграцию), целевая перспектива — перенос в
  Home Assistant Core при достижении нужного уровня Integration Quality Scale.

  Обязательные правила проекта — в AGENTS.md в корне: структура каталогов, процесс OpenSpec,
  технические требования Home Assistant, тестирование, публикация, путь в Core.

  Факты об устройствах и протоколах — в references/<device>/DEVICE-FACTS.md. Это исходные
  данные, а не спецификация: при расхождении правы первоисточники из references/.

  Стек: Python 3.14, Home Assistant 2026.11 (минимальная поддерживаемая версия), asyncio.
  Протокол устройства живёт в отдельной библиотеке на PyPI, интеграция только связывает
  её с Home Assistant. Тесты — pytest + pytest-homeassistant-custom-component.

  Язык: артефакты OpenSpec и общение — на русском; заголовки OpenSpec, ключевые слова
  SHALL/MUST и код — на английском.

rules:
  proposal:
    - "Перечислить, какие правила Integration Quality Scale закрывает изменение, и какой tier
      становится достижим (Bronze/Silver/Gold/Platinum)."
    - "Отдельно указать, что входит в первую версию, а что сознательно отложено, с причиной."
    - "Явно назвать домен интеграции и обосновать, что он не занят интеграцией Core."
  specs:
    - "Требования формулируются в терминах наблюдаемого поведения Home Assistant: состояния
      сущностей, шаги config flow, ошибки, repair issues. Внутренние имена классов и функций
      в спецификации не используются."
    - "Для каждого требования — хотя бы один Scenario в форме WHEN/THEN, который можно
      превратить в тест."
    - "Если поведение зависит от значения регистра устройства, указать регистр, разрешение и
      единицу — это часть контракта, а не деталь реализации."
  design:
    - "Привести полную карту регистров с адресами, разрешением и единицами, включая пометки
      достоверности."
    - "Обосновать выбор: модель конфигурации (запись на шину + устройства), транспорт
      (RTU и TCP), стратегия обновления (опрос или активный отчёт), отказ от внешних
      зависимостей в пользу собственной библиотеки."
    - "Перечислить открытые вопросы, которые нельзя закрыть по документации, и способ их
      проверки на живом устройстве."
  tasks:
    - "Тесты идут в той же группе, что и реализация, которую они проверяют."
    - "Отдельной группы «финальная проверка» или «документация» быть не должно: проверки
      входят в группу, которую они проверяют."
    - "Каждая задача, меняющая поведение, помечается ссылкой на требование спецификации."

operations:
  apply:
    guidance:
      - "Перед кодом прочитать AGENTS.md и references/<device>/DEVICE-FACTS.md."
      - "Работать только в рамках tasks.md текущего change."
  archive:
    guidance:
      - "Перед архивированием убедиться, что quality_scale.yaml и README отражают итоговое
        поведение."
